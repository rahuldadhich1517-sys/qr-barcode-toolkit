<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Scanner Example - QR & Barcode Toolkit</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .video-container {
      width: 100%;
      max-width: 480px;
      background: #111;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    video {
      width: 100%;
      height: auto;
      display: block;
    }
    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    button {
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
    }
    .log-box {
      background: #f4f4f4;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 12px;
      min-height: 80px;
      white-space: pre-wrap;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <h1>QR & Barcode Live Scanner Demo</h1>
  <p>Select camera and start scanning. Camera requires HTTPS or localhost.</p>

  <div class="video-container">
    <video id="preview" playsinline muted autoplay></video>
  </div>

  <div class="controls">
    <button id="btn-start">Start Scanner</button>
    <button id="btn-pause" disabled>Pause</button>
    <button id="btn-resume" disabled>Resume</button>
    <button id="btn-stop" disabled>Stop</button>
  </div>

  <h3>Latest Scan Result</h3>
  <div id="output" class="log-box">Waiting for scan...</div>

  <!-- Using ES Modules from built bundle -->
  <script type="module">
    import { createQrScanner } from '../dist/browser/index.mjs';

    const videoEl = document.getElementById('preview');
    const outputEl = document.getElementById('output');
    const btnStart = document.getElementById('btn-start');
    const btnPause = document.getElementById('btn-pause');
    const btnResume = document.getElementById('btn-resume');
    const btnStop = document.getElementById('btn-stop');

    let scanner = null;

    btnStart.addEventListener('click', async () => {
      try {
        if (!scanner) {
          scanner = createQrScanner({
            video: videoEl,
            camera: { facingMode: 'environment' },
            duplicateDelayMs: 1500,
            onScan: (res) => {
              outputEl.textContent = `Scanned [${res.format}]: ${res.text}`;
            },
            onError: (err) => {
              outputEl.textContent = `Error: ${err.message}`;
            }
          });
        }
        await scanner.start();
        btnStart.disabled = true;
        btnPause.disabled = false;
        btnStop.disabled = false;
      } catch (err) {
        outputEl.textContent = `Start error: ${err.message}`;
      }
    });

    btnPause.addEventListener('click', () => {
      if (scanner) {
        scanner.pause();
        btnPause.disabled = true;
        btnResume.disabled = false;
      }
    });

    btnResume.addEventListener('click', () => {
      if (scanner) {
        scanner.resume();
        btnPause.disabled = false;
        btnResume.disabled = true;
      }
    });

    btnStop.addEventListener('click', async () => {
      if (scanner) {
        await scanner.stop();
        scanner.destroy();
        scanner = null;
        btnStart.disabled = false;
        btnPause.disabled = true;
        btnResume.disabled = true;
        btnStop.disabled = true;
        outputEl.textContent = 'Scanner stopped and destroyed.';
      }
    });
  </script>
</body>
</html>
